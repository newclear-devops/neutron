name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Both targets are cross-compiled in a single job: with a matrix the two
      # jobs would race to create the release they both upload to.
      - name: Build binaries
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            export CGO_ENABLED=0 GOOS=linux GOARCH="$arch"
            go build -trimpath -ldflags="-s -w" -o "neutron-api-linux-$arch" ./cmd/api
            go build -trimpath -ldflags="-s -w" -o "neutron-gitlab-runner-linux-$arch" ./cmd/gitlab-runner
            go build -trimpath -ldflags="-s -w" -o "neutron-codeup-runner-linux-$arch" ./cmd/codeup-runner
          done

      - name: Create checksums
        run: |
          set -euo pipefail
          sha256sum neutron-api-* neutron-gitlab-runner-* neutron-codeup-runner-* > checksums-sha256.txt
          cat checksums-sha256.txt

      # Publish straight to the GitHub Release instead of going through
      # artifacts: release assets are permanent and do not consume the
      # (small, org-wide) Actions artifact storage quota.
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          files=(
            neutron-api-linux-amd64 neutron-api-linux-arm64
            neutron-gitlab-runner-linux-amd64 neutron-gitlab-runner-linux-arm64
            neutron-codeup-runner-linux-amd64 neutron-codeup-runner-linux-arm64
            checksums-sha256.txt
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" --title "$tag" --generate-notes "${files[@]}"
          fi
