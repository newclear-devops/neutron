<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>neutron</title>
    <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        /* The page is hard-coded light (white background, dark text) but native
           widgets follow the browser's own colour scheme. Without this, a
           browser in dark mode draws form-control popups dark - most visibly the
           datalist suggestion list, which the browser renders itself and cannot
           be styled from here - while select popups stay white, because those do
           take the element's own background. */
        html { font-size: 10px; color-scheme: light; }
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            font-size: 1.6rem;
            color: #606c76;
            background: #fff;
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3, h4, h5, h6 { color: #222; font-weight: 300; margin-bottom: 1rem; }
        h1 { font-size: 3.2rem; }
        h2 { font-size: 2.8rem; }
        h3 { font-size: 2.4rem; }
        h4 { font-size: 2rem; }
        strong, b { color: #222; font-weight: 700; }
        a { color: #9b4dca; text-decoration: none; }
        a:hover { color: #7b2fa0; text-decoration: underline; }

        /* --- Nav --- */
        nav {
            background: #f4f5f6;
            padding: 0 32px;
            display: flex;
            align-items: center;
            height: 54px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #d1d1d1;
        }
        nav .brand {
            font-weight: 700;
            font-size: 1.8rem;
            color: #606c76;
            text-decoration: none;
            letter-spacing: .3px;
            margin-right: 36px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        nav .brand:hover { color: #9b4dca; text-decoration: none; }
        nav .logo { width: 28px; height: 28px; }
        nav a {
            color: #606c76;
            font-size: 1.4rem;
            font-weight: 600;
            margin-right: 24px;
            text-decoration: none;
            transition: color .15s;
        }
        nav a:hover { color: #9b4dca; text-decoration: none; }

        /* --- Layout --- */
        .container { max-width: 960px; margin: 0 auto; padding: 32px 24px; }

        /* --- Hero --- */
        .hero { text-align: center; padding: 80px 0 40px; }
        .hero .hero-logo { width: 80px; height: 80px; margin-bottom: 16px; }
        .hero h1 { font-size: 4.8rem; font-weight: 300; color: #222; letter-spacing: -1px; margin-bottom: .4rem; }
        .hero p { font-size: 1.8rem; color: #999; margin-top: 0; }
        .arch-banner { background: #f0fdf4; padding: 24px 0; text-align: center; border-top: 1px solid #e5e7eb; border-bottom: 1px solid #e5e7eb; }
        .arch-banner img { max-width: 480px; width: 60%; height: auto; }

        /* --- Steps --- */
        .steps-title { text-align: center; font-size: 2rem; font-weight: 300; color: #222; margin: 48px 0 32px; }
        .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; margin-bottom: 64px; }
        .step { text-align: center; }
        .step-num { font-size: 3.2rem; font-weight: 300; color: #9b4dca; margin-bottom: 12px; }
        .step p { color: #606c76; font-size: 1.4rem; margin-top: 6px; }
        .step pre {
            text-align: left; background: #f9fafb; border: 1px solid #e5e7eb;
            border-radius: 4px; padding: 16px; font-size: 1.3rem; margin-top: 12px;
            overflow-x: auto; line-height: 1.5;
        }

        /* --- Footer --- */
        .footer { text-align: center; padding: 32px 0; color: #999; font-size: 1.3rem; border-top: 1px solid #f3f4f6; margin-top: 32px; }

        /* --- Card --- */
        .card {
            background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
            padding: 20px 24px; margin-bottom: 24px;
        }

        /* --- Meta rows --- */
        .meta { margin-bottom: 20px; }
        .meta div { color: #606c76; font-size: 1.4rem; margin-bottom: 4px; }
        .meta b { color: #222; }
        .stat-row { display: flex; gap: 32px; margin: 16px 0; }
        .stat { font-size: 1.4rem; color: #606c76; }
        .stat b { color: #222; font-size: 1.4rem; }

        /* --- Table --- */
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th { text-align: left; font-size: 1.3rem; font-weight: 600; color: #222; padding: 10px 12px; border-bottom: 2px solid #e5e7eb; }
        td { padding: 10px 12px; border-bottom: 1px solid #f3f4f6; font-size: 1.4rem; color: #606c76; }
        tr:hover td { background: #f9fafb; }
        td a { font-weight: 600; }

        /* --- Pod list and its action row --- */
        /* The pod table's Status column is given a fixed width so the action row
           below can mirror the very same column split. That puts the buttons in
           line with the pod list: Test Report / Rerun under Pod, Kill under
           Status. Pushed to the card's right edge instead, Kill read as floating
           outside the table. The variable keeps the two rules in sync. */
        .card { --pod-status-col: 120px; }
        .pod-table th:last-child, .pod-table td:last-child { width: var(--pod-status-col); }
        .pod-actions {
            display: grid; grid-template-columns: 1fr var(--pod-status-col);
            gap: 12px; align-items: center; margin-top: 16px;
        }
        .pod-actions .pa-left { display: flex; gap: 12px; align-items: center; }
        /* Matches the cells' 12px left padding, so the button lines up with the
           "Status" header and the phase text rather than the column's edge. */
        .pod-actions .pa-kill { padding-left: 12px; }

        /* --- Form --- */
        /* Form controls do not pick up the page font on their own: the browser's
           own stylesheet sets a font directly on them, and a rule targeting the
           element beats inheritance from body. Without this they fall back to
           Arial even where the stack above would resolve to something else. */
        input, select, textarea, button { font-family: inherit; }
        .form-wrap { max-width: 480px; }
        .form-wrap h3 { margin-bottom: 24px; }
        label { display: block; font-size: 1.3rem; font-weight: 600; color: #222; margin-bottom: 6px; margin-top: 16px; }
        label:first-child { margin-top: 0; }
        input[type="text"], select {
            width: 100%; padding: 10px 12px; font-size: 1.4rem;
            border: 1px solid #d1d5db; border-radius: 4px;
            background: #fff; color: #606c76;
            transition: border-color .15s;
        }
        input[type="text"]:focus, select:focus { outline: none; border-color: #9b4dca; box-shadow: 0 0 0 2px rgba(155,77,202,.15); }
        input[type="text"]::placeholder { color: #999; }

        /* --- Buttons --- */
        .btn {
            display: inline-block; padding: 10px 24px; font-size: 1.4rem; font-weight: 600;
            border: 1px solid #9b4dca; border-radius: 4px; cursor: pointer;
            transition: background .15s; text-align: center;
        }
        .btn-primary { background: #9b4dca; color: #fff; margin-top: 24px; }
        .btn-primary:hover { background: #7b2fa0; }
        .btn-outline { background: #fff; color: #606c76; border: 1px solid #d1d5db; }
        .btn-outline:hover { background: #f9fafb; border-color: #9b4dca; color: #9b4dca; }
        /* Destructive actions: red rather than purple, so "this one is risky"
           reads before the label does. margin-top 0 because it is used inside
           dialogs, where .btn-primary's form margin would push it off-centre. */
        .btn-danger { background: #dc2626; border-color: #dc2626; color: #fff; margin-top: 0; }
        .btn-danger:hover { background: #b91c1c; border-color: #b91c1c; }

        /* --- Success message --- */
        .success-box {
            max-width: 520px; margin: 48px auto; text-align: center;
            background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 4px; padding: 32px;
        }
        .success-box h4 { color: #15803d; margin-bottom: 12px; }
        .success-box p { color: #606c76; font-size: 1.4rem; margin-bottom: 8px; }
        .webhook-url {
            background: #fff; border: 1px solid #d1d5db; border-radius: 4px;
            padding: 12px 16px; font-family: "SF Mono", "Fira Code", Menlo, monospace;
            font-size: 1.3rem; margin: 16px 0; word-break: break-all; color: #222;
        }

        /* --- External log link hint --- */
        .log-hint { color: #999; font-size: 1.2rem; margin: 12px 0 0; }

        /* --- Page title --- */
        .page-title { font-size: 2.4rem; font-weight: 300; color: #222; margin-bottom: 24px; }
        .page-title b { color: #9b4dca; font-weight: 700; }

        /* --- Tags --- */
        .tag { display: inline-flex; align-items: center; background: #f5f3ff; color: #6d28d9; font-size: 1.2rem; font-weight: 600; padding: 3px 10px; border-radius: 6px; letter-spacing: .2px; }
        .tag-add { display: inline-flex; align-items: center; gap: 2px; color: #9b4dca; font-size: 1.2rem; font-weight: 600; padding: 3px 10px; border-radius: 6px; border: 1px dashed #d8b4fe; cursor: pointer; transition: all .15s; background: transparent; }
        .tag-add:hover { background: #f5f3ff; border-color: #9b4dca; }

        /* --- Modal --- */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; display: flex; align-items: center; justify-content: center; }
        .modal { background: #fff; border-radius: 8px; padding: 28px 32px; max-width: 440px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,.18); }
        .modal h4 { margin-bottom: 16px; font-size: 1.8rem; }
        .modal-input-row { display: flex; gap: 8px; margin-top: 16px; }
        .modal-input-row input { flex: 1; margin: 0; }
        .modal-body { margin-bottom: 20px; font-size: 1.4rem; color: #606c76; line-height: 1.7; }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

        /* --- Manual trigger toolbar (project detail page) --- */
        /* A boxed panel pinned to the right of the page header. The four controls
           share one row — which keeps the panel about as tall as the title and
           back link beside it — and the trigger result takes a second row of its
           own only when there is something to report. */
        .trigger-toolbar {
            display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 12px 16px; align-items: end;
            /* An explicit width rather than a flex basis: the panel renders
               inside the header's #manualTriggerPanel wrapper, so the toolbar is
               not itself a flex item of the header row and a flex basis would be
               ignored — it would size to its content and push the row to wrap. */
            width: 680px; max-width: 100%;
            background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px;
            padding: 14px 20px;
        }
        .trigger-toolbar .tt-field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .trigger-toolbar .tt-label {
            margin: 0; font-size: 1.1rem; font-weight: 600; color: #999;
            text-transform: uppercase; letter-spacing: .4px; user-select: none; white-space: nowrap;
        }
        .trigger-toolbar .tt-label.tt-clickable { color: #9b4dca; cursor: pointer; }
        .trigger-toolbar .tt-label.tt-clickable:hover { text-decoration: underline; }
        /* All three fields use the same own-drawn dropdown. The native widgets
           they replace each draw their own popup, in a style the page cannot
           reach: a select popup takes the element's colours, while the datalist
           popup ignores them entirely and follows the browser's colour scheme.
           That is why they never matched. */
        .trigger-toolbar .tt-dropdown { position: relative; }
        .trigger-toolbar .tt-control {
            width: 100%; padding: 7px 26px 7px 10px; font-size: 1.3rem;
            border: 1px solid #d1d5db; border-radius: 4px;
            background: #fff; color: #606c76; cursor: pointer;
            transition: border-color .15s;
        }
        .trigger-toolbar .tt-control:focus {
            outline: none; border-color: #9b4dca; box-shadow: 0 0 0 2px rgba(155,77,202,.15);
        }
        .trigger-toolbar .tt-control::placeholder { color: #bbb; }
        /* The same caret a native select draws, so all three read the same. */
        .trigger-toolbar .tt-caret {
            position: absolute; right: 10px; top: 50%; margin-top: -2px;
            width: 0; height: 0; pointer-events: none;
            border-left: 4px solid transparent; border-right: 4px solid transparent;
            border-top: 5px solid #999;
        }
        /* Type-to-filter fields also get a clear affordance. It sits to the
           left of the caret rather than replacing it, so all three controls
           keep the same caret and still read as the same kind of widget. */
        .trigger-toolbar .tt-clear {
            position: absolute; right: 22px; top: 50%; margin-top: -9px;
            width: 18px; height: 18px; padding: 0; line-height: 16px;
            border: none; border-radius: 50%;
            background: #e5e7eb; color: #606c76;
            font-size: 1.4rem; text-align: center; cursor: pointer;
            display: none;
        }
        .trigger-toolbar .tt-dropdown.has-value .tt-clear { display: block; }
        .trigger-toolbar .tt-clear:hover { background: #d1d5db; color: #333; }
        /* Room for the clear button beside the caret. Only the right padding
           changes, so the text itself never shifts when the button appears. */
        .trigger-toolbar .tt-dropdown.has-value .tt-control { padding-right: 44px; }
        .trigger-toolbar .tt-options {
            display: none; position: absolute; z-index: 60; left: 0; right: 0; top: 100%; margin-top: 4px;
            max-height: 220px; overflow-y: auto;
            background: #fff; border: 1px solid #d1d5db; border-radius: 4px;
            box-shadow: 0 6px 16px rgba(0,0,0,.14);
        }
        .trigger-toolbar .tt-options.open { display: block; }
        .trigger-toolbar .tt-option {
            padding: 6px 10px; font-size: 1.3rem; color: #606c76; cursor: pointer;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .trigger-toolbar .tt-option + .tt-option { border-top: 1px solid #f3f4f6; }
        .trigger-toolbar .tt-option:hover,
        .trigger-toolbar .tt-option.active { background: #f5f3ff; color: #6d28d9; }
        .trigger-toolbar .tt-option.is-empty,
        .trigger-toolbar .tt-option.is-empty:hover { color: #999; background: none; cursor: default; }
        .trigger-toolbar .tt-option-meta { color: #999; font-size: 1.1rem; margin-left: 6px; }
        /* Trigger and the round hide button share the last column, so they stay
           on one line however narrow that column gets. */
        .trigger-toolbar .tt-actions { display: flex; align-items: center; gap: 8px; }
        .trigger-toolbar .tt-submit { padding: 8px 18px; font-size: 1.3rem; margin-top: 0; white-space: nowrap; }
        .trigger-toolbar .tt-collapse {
            width: 24px; height: 24px; padding: 0; flex: none;
            border: 1px solid #d1d5db; border-radius: 50%; background: #fff; color: #999;
            font-size: 1.5rem; line-height: 1; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .trigger-toolbar .tt-collapse:hover { background: #f3f4f6; border-color: #9b4dca; color: #9b4dca; }
        /* Feedback spans the panel and only exists once there is something to
           say: while hidden it is not a grid item, so it adds no row. */
        .trigger-toolbar .tt-result { grid-column: 1 / -1; font-size: 1.3rem; line-height: 1.4; }

        /* --- Responsive --- */
        @media (max-width: 640px) {
            .steps { grid-template-columns: 1fr; }
            .stat-row { flex-direction: column; gap: 8px; }
            .hero h1 { font-size: 3.2rem; }
            nav { padding: 0 16px; }
            .container { padding: 24px 16px; }
        }
    </style>
</head>
<body>
<nav>
    <a class="brand" href="#/"><img src="/static/logo.svg" alt="neutron" class="logo">neutron</a>
    <a href="#/projects">Projects</a>
    <a href="#/recent">Recent Jobs</a>
    <a href="#/snippets">Snippets</a>
    <a href="#/default-pipeline">Default Pipeline</a>
    <a href="#/register">Register</a>
    <span style="flex:1"></span>
    <a href="#/help" style="margin-right:0">📖 Help</a>
</nav>
<div id="app" class="container"></div>
<script>
(function() {
    var app = document.getElementById('app');
    var appConfig = { logUrl: '', namespace: 'default', codebaseUrls: {} };

    // --- Config ---
    fetch('/api/config').then(function(r){ return r.json(); }).then(function(c){
        appConfig.logUrl = c.logUrl || '';
        appConfig.namespace = c.namespace || 'default';
        appConfig.codebaseUrls = c.codebaseUrls || {};
    });

    function buildLogUrl(podId) {
        if (!appConfig.logUrl) return '#';
        return appConfig.logUrl.replace('{namespace}', encodeURIComponent(appConfig.namespace)).replace('{podId}', encodeURIComponent(podId));
    }

    // Job and pod names end with a run timestamp in one of the layouts that have
    // shipped over time: YYMMDDHHMMSS (current), YYYYMMDD-HHMMSS, and the same
    // without the random suffix. Returns the run start as a Date, or null when
    // the name matches none of them. Unanchored, because a pod name carries an
    // extra K8s-generated suffix after the job name.
    function parseNameTimestamp(name) {
        var match = String(name || '').match(/(\d{12}|\d{8}-\d{6})/);
        if (!match) return null;
        var ts = match[1];
        if (ts.length === 12) {
            return new Date(2000 + parseInt(ts.substring(0, 2), 10), parseInt(ts.substring(2, 4), 10) - 1,
                parseInt(ts.substring(4, 6), 10), parseInt(ts.substring(6, 8), 10),
                parseInt(ts.substring(8, 10), 10), parseInt(ts.substring(10, 12), 10));
        }
        return new Date(parseInt(ts.substring(0, 4), 10), parseInt(ts.substring(4, 6), 10) - 1,
            parseInt(ts.substring(6, 8), 10), parseInt(ts.substring(9, 11), 10),
            parseInt(ts.substring(11, 13), 10), parseInt(ts.substring(13, 15), 10));
    }

    function isPodLogExpired(podName) {
        // Pod name format: neutron-[{project}-]{jobName}-{timestamp}-{random}{podSuffix}
        var podDate = parseNameTimestamp(podName);
        if (!podDate) return false;
        var diff = Date.now() - podDate.getTime();
        return diff > 7 * 24 * 60 * 60 * 1000;
    }

    function openPodLog(podName, podId) {
        if (!appConfig.logUrl) return;
        if (isPodLogExpired(podName)) {
            alert('Logs older than 7 days have been cleaned up and are no longer available.');
            return;
        }
        window.open(buildLogUrl(podId || podName), '_blank');
    }
    window.openPodLog = openPodLog;

    // --- Router ---
    function route() {
        var hash = location.hash || '#/';
        app.innerHTML = '';
        window.scrollTo(0, 0);

        if (hash === '#/' || hash === '#' || hash === '#/home') {
            renderHome();
        } else if (hash === '#/projects') {
            renderProjects();
        } else if (hash === '#/recent') {
            renderRecentJobs();
        } else if (hash === '#/register') {
            renderRegister();
        } else if (hash === '#/snippets') {
            renderSnippets();
        } else if (hash === '#/default-pipeline') {
            renderDefaultPipeline();
        } else if (hash === '#/help') {
            renderHelp();
        } else if (hash.startsWith('#/register/success?')) {
            renderRegisterInfo();
        } else if (hash.startsWith('#/status/')) {
            renderStatus(hash.slice('#/status/'.length));
        } else if (hash.startsWith('#/project/')) {
            renderProjectJobs(hash.slice('#/project/'.length));
        } else {
            renderHome();
        }
    }

    window.addEventListener('hashchange', route);
    window.addEventListener('DOMContentLoaded', route);

    // --- SSH to HTTP conversion ---
    function sshToHttp(sshUrl, webhookType) {
        if (!sshUrl) return '';

        // Codeup: ssh://git@codeup.xxx.com:9022/org-id/path/repo.git → http://codeup.xxx.com/codeup/org-id/path/repo
        if (sshUrl.startsWith('ssh://git@codeup')) {
            var hostEnd = sshUrl.indexOf(':9022');
            if (hostEnd > 0) {
                var host = sshUrl.substring(10, hostEnd); // extract "codeup.devops.csdc.com"
                var path = sshUrl.substring(hostEnd + 5).replace(/\.git$/, ''); // skip ":9022"
                return 'http://' + host + '/codeup' + path;
            }
        }

        // GitLab and others: use codebaseUrls from config
        var baseUrl = appConfig.codebaseUrls[webhookType] || '';
        if (!baseUrl) return '';
        baseUrl = baseUrl.replace(/\/+$/, '');

        if (sshUrl.startsWith('ssh://')) {
            // ssh://git@host:port/path.git → baseUrl/path
            var parts = sshUrl.replace('ssh://', '').split(':');
            if (parts.length >= 2) {
                var path = parts[parts.length - 1];
                if (/^\d+\//.test(path)) {
                    path = path.replace(/^\d+\//, '');
                }
                return baseUrl + '/' + path.replace(/\.git$/, '');
            }
        } else if (sshUrl.startsWith('git@')) {
            // git@host:path.git → baseUrl/path
            var colonIdx = sshUrl.indexOf(':');
            if (colonIdx > 0) {
                var path = sshUrl.substring(colonIdx + 1);
                return baseUrl + '/' + path.replace(/\.git$/, '');
            }
        }
        return '';
    }

    // --- Extract repo name from URL ---
    function getRepoName(repoUrl) {
        if (!repoUrl) return '';
        // Remove .git suffix, then take the last path segment
        var url = repoUrl.replace(/\.git$/, '');
        var parts = url.split('/');
        return parts[parts.length - 1] || '';
    }

    // --- Parse job status JSON ---
    function parseJobStatus(statusStr) {
        try { return JSON.parse(statusStr); } catch(e) { return {}; }
    }

    // --- Timeout for listing requests ---
    // A fetch only settles once the connection breaks, so an API sitting on a
    // slow query or a half-open connection leaves the page on "Loading..."
    // indefinitely, indistinguishable from a page that is merely still working.
    // Cap it and surface the failure instead.
    var REQUEST_TIMEOUT_MS = 20000;

    function fetchWithTimeout(url) {
        var timer = null;
        var controller = window.AbortController ? new AbortController() : null;
        if (controller) {
            timer = setTimeout(function() { controller.abort(); }, REQUEST_TIMEOUT_MS);
        }
        return fetch(url, controller ? { signal: controller.signal } : undefined)
            .then(function(r) { clearTimeout(timer); return r; })
            .catch(function(err) {
                clearTimeout(timer);
                if (err && err.name === 'AbortError') {
                    throw new Error('request timed out after ' + (REQUEST_TIMEOUT_MS / 1000) + 's');
                }
                throw err;
            });
    }

    // --- Recent Jobs ---
    // Paging and searching both happen in the API now. The window can hold
    // thousands of rows, so fetching all of them just to slice them in the
    // browser cost the same DB work as showing them all.
    var RECENT_PAGE_SIZE = 20;
    var _recentJobs = [];      // current page only
    var _recentPage = 0;       // 0-based
    var _recentTotal = 0;      // rows in the whole window, for the page count
    var _recentQuery = '';
    var _recentSearchTimer = null;
    // Incremented per request: a slow reply for the previous page must not
    // overwrite the list after a newer one already landed.
    var _recentReqSeq = 0;

    function loadRecentJobs() {
        var seq = ++_recentReqSeq;
        var url = '/api/jobs/recent?page=' + (_recentPage + 1) + '&page_size=' + RECENT_PAGE_SIZE +
            (_recentQuery ? '&q=' + encodeURIComponent(_recentQuery) : '');
        return fetchWithTimeout(url)
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var listEl = document.getElementById('recentJobsList');
                if (!listEl || seq !== _recentReqSeq) return; // navigated away or superseded
                if (data.error) {
                    listEl.innerHTML = '<p style="color:#c00">' + escHtml(data.error) + '</p>';
                    var pagEl = document.getElementById('recentPagination');
                    if (pagEl) pagEl.innerHTML = '';
                    return;
                }
                _recentJobs = data.jobs || [];
                _recentTotal = data.total || 0;
                renderRecentJobsPage();
            })
            .catch(function(err) {
                if (seq !== _recentReqSeq) return;
                var el = document.getElementById('recentJobsList');
                if (el) el.innerHTML = '<p style="color:#c00">Failed to load: ' + escHtml(String(err)) + '</p>';
            });

    function renderRecentJobs() {
        app.innerHTML =
            '<p class="page-title">Recent <b>Jobs</b> <span style="font-size:1.4rem;color:#999;font-weight:400">(last 7 days)</span></p>' +
            '<div style="margin-bottom:20px">' +
                '<input type="text" id="recentSearchInput" placeholder="Filter by project, job name, or status..." style="max-width:400px">' +
            '</div>' +
            '<div id="recentJobsList"><p style="color:#999">Loading...</p></div>' +
            '<div id="recentPagination" style="text-align:center;margin-top:24px"></div>';

        _recentJobs = [];
        _recentTotal = 0;
        _recentPage = 0;
        _recentQuery = '';

        // Debounced: every keystroke would otherwise be a round trip.
        document.getElementById('recentSearchInput').addEventListener('input', function() {
            var value = this.value;
            clearTimeout(_recentSearchTimer);
            _recentSearchTimer = setTimeout(function() {
                _recentQuery = value.trim();
                _recentPage = 0;
                loadRecentJobs();
            }, 300);
        });

        loadRecentJobs();
    }

    function renderRecentJobsPage() {
        var totalPages = Math.ceil(_recentTotal / RECENT_PAGE_SIZE);
        if (_recentJobs.length === 0) {
            document.getElementById('recentJobsList').innerHTML = '<p style="color:#999">No jobs found.</p>';
            document.getElementById('recentPagination').innerHTML = '';
            return;
        }

        var start = _recentPage * RECENT_PAGE_SIZE;
        var end = start + _recentJobs.length;
        var pageJobs = _recentJobs;

        var html = '<table><thead><tr><th>Status</th><th>Project</th><th>Job Name</th><th>Pod</th><th>Time</th><th></th></tr></thead><tbody>';
        for (var i = 0; i < pageJobs.length; i++) {
            var job = pageJobs[i];
            var st = parseJobStatus(job.Status);
            var statusIcon = '⏳';
            var statusColor = '#999';
            if (st.succeeded > 0) { statusIcon = '✅'; statusColor = '#00cc66'; }
            else if (st.failed > 0) { statusIcon = '❌'; statusColor = '#ff3333'; }
            else if (st.active > 0) { statusIcon = '🔄'; statusColor = '#3399ff'; }

            var repoName = getRepoName(st.repo_url) || job.ProjectId;
            var podName = (job.Pods && job.Pods.length > 0) ? job.Pods[0].PodName : '-';
            var triggerType = st.trigger_type || '-';
            var timeStr = '';
            if (job.CompletedAt) {
                var d = new Date(job.CompletedAt);
                timeStr = d.toLocaleString();
            }

            html += '<tr>';
            html += '<td style="color:' + statusColor + ';font-size:1.8rem">' + statusIcon + '</td>';
            html += '<td><b>' + escHtml(repoName) + '</b></td>';
            html += '<td>' + escHtml(job.Name) + '</td>';
            html += '<td style="font-size:1.3rem;color:#999">' + escHtml(podName) + '</td>';
            html += '<td style="font-size:1.3rem;color:#999">' + escHtml(timeStr) + '</td>';
            html += '<td><a href="#/status/' + escAttr(job.Name) + '" class="btn btn-outline" style="padding:4px 12px;font-size:1.2rem">View</a></td>';
            html += '</tr>';
        }
        html += '</tbody></table>';
        document.getElementById('recentJobsList').innerHTML = html;

        // Pagination controls
        var paginationHtml = '<div style="font-size:1.3rem;color:#999;margin-bottom:8px">Showing ' + (start + 1) + '-' + end + ' of ' + _recentTotal + ' jobs</div>';
        if (totalPages > 1) {
            paginationHtml += '<div style="display:flex;justify-content:center;align-items:center;gap:12px">';
            paginationHtml += '<button class="btn btn-outline" style="padding:6px 16px;font-size:1.3rem"' +
                (_recentPage === 0 ? ' disabled' : '') +
                ' onclick="recentJobsPrevPage()">← Prev</button>';
            paginationHtml += '<span style="font-size:1.3rem;color:#606c76">Page ' + (_recentPage + 1) + ' of ' + totalPages + '</span>';
            paginationHtml += '<button class="btn btn-outline" style="padding:6px 16px;font-size:1.3rem"' +
                (_recentPage >= totalPages - 1 ? ' disabled' : '') +
                ' onclick="recentJobsNextPage()">Next →</button>';
            paginationHtml += '</div>';
        }
        document.getElementById('recentPagination').innerHTML = paginationHtml;
    }

    function recentJobsPrevPage() {
        if (_recentPage > 0) { _recentPage--; loadRecentJobs(); }
    }
    function recentJobsNextPage() {
        var totalPages = Math.ceil(_recentTotal / RECENT_PAGE_SIZE);
        if (_recentPage < totalPages - 1) { _recentPage++; loadRecentJobs(); }
    }
    window.recentJobsPrevPage = recentJobsPrevPage;
    window.recentJobsNextPage = recentJobsNextPage;

                        '<tr><td style="padding:8px;border-bottom:1px solid #f3f4f6"><code>ref</code></td><td style="padding:8px;border-bottom:1px solid #f3f4f6">Git ref to checkout (tag, branch, or commit SHA)</td><td style="padding:8px;border-bottom:1px solid #f3f4f6">Yes</td></tr>' +
                        '<tr><td style="padding:8px"><code>env</code></td><td style="padding:8px">Custom environment variables for the pipeline pod</td><td style="padding:8px">No</td></tr>' +
                    '</tbody>' +
                '</table>' +
                '<p style="margin-top:12px;color:#999;font-size:1.3rem">Works for both GitLab and Codeup projects.</p>' +
            '</div>';
    }

    // --- Projects List ---
    function renderProjects() {
        app.innerHTML =
            '<p class="page-title">Registered <b>Projects</b></p>' +
            '<div style="margin-bottom:20px">' +
                '<input type="text" id="searchInput" placeholder="Filter by repository URL..." style="max-width:400px">' +
            '</div>' +
            '<div id="projectsList"><p style="color:#999">Loading...</p></div>';

        fetch('/api/projects')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.error) {
                    document.getElementById('projectsList').innerHTML = '<p style="color:#c00">' + escHtml(data.error) + '</p>';
                    return;
                }
                window._projects = data.projects || [];
                renderProjectsList(window._projects);

                document.getElementById('searchInput').addEventListener('input', function() {
                    var q = this.value.toLowerCase();
                    var filtered = window._projects.filter(function(p) {
                        return !q || (p.RepoUrl && p.RepoUrl.toLowerCase().indexOf(q) >= 0);
                    });
                    renderProjectsList(filtered);
                });
            })
            .catch(function(err) {
                document.getElementById('projectsList').innerHTML = '<p style="color:#c00">Failed to load: ' + escHtml(String(err)) + '</p>';
            });
    }

    function renderProjectsList(projects) {
        var el = document.getElementById('projectsList');
        if (!projects || projects.length === 0) {
            el.innerHTML = '<p style="color:#999">No projects registered. <a href="#/register">Create one</a></p>';
            return;
        }

        var html = '<table><thead><tr><th>Type</th><th>Name</th><th>Repository</th><th>Actions</th></tr></thead><tbody>';
        for (var i = 0; i < projects.length; i++) {
            var p = projects[i];
            var httpUrl = sshToHttp(p.RepoUrl, p.WebhookType);
            var repoName = getRepoName(p.RepoUrl);
            var repoHtml = httpUrl
                ? '<a target="_blank" href="' + escAttr(httpUrl) + '">' + escHtml(p.RepoUrl) + '</a>'
                : escHtml(p.RepoUrl);
            html += '<tr><td>' + escHtml(p.WebhookType) + '</td><td><b>' + escHtml(repoName) + '</b></td><td>' + repoHtml + '</td><td><a href="#/project/' + escAttr(p.Id) + '" class="btn btn-outline" style="padding:6px 16px;font-size:1.3rem">View</a></td></tr>';
        }
        html += '</tbody></table>';
        el.innerHTML = html;
    }

    // --- Project Jobs ---

    function renderProjectJobs(projectId) {
        // Must carry every field declared in the initial value below: the
        // render guard compares seq against the state, and ++undefined is NaN,
        // which never equals itself — the page would stay on "Loading..." with
        // every request succeeding.
        _projectState = { id: projectId, page: 0, jobName: '', allHistory: false, total: 0, jobs: [], seq: 0 };
        _projectJobNames = [];
        // expanded: the panel starts collapsed on every visit, so the page opens
        // on a single button. open/active track the dropdown that is currently
        // showing, and are reset with the page.
        _manualTrigger = { projectId: projectId, repoUrl: '', refMode: 'branches', expanded: false, open: '', active: -1 };
        _ttOptions = { ttRef: [], ttJob: [], ttDepBranch: [] };
        app.innerHTML =
            // Header: the title and the back link stack on the left, while the
            // manual trigger panel takes the right-hand side beside them.
            '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;margin-bottom:24px">' +
                '<div>' +
                    '<p class="page-title" style="margin-bottom:16px">Pipeline history</p>' +
                    '<a href="#/projects" class="btn btn-outline" style="padding:6px 16px;font-size:1.3rem">← Back to Projects</a>' +
                '</div>' +
                '<div id="manualTriggerPanel">' + renderManualTriggerPanel() + '</div>' +
            '</div>' +
            '<div id="projectInfo"></div>' +
            // Both controls scope the history list immediately below them, so
            // they sit with the table rather than up next to the back link.
            '<div style="margin-bottom:16px;display:flex;gap:12px;align-items:center">' +
                '<select id="jobNameFilter" style="max-width:200px;padding:6px 12px;font-size:1.3rem;border:1px solid #d1d5db;border-radius:4px;color:#606c76"><option value="">All jobs</option></select>' +
                '<button id="historyToggle" class="btn btn-outline" style="padding:6px 16px;font-size:1.3rem;margin-top:0" onclick="projectJobsToggleHistory()">Show all history</button>' +
            '</div>' +
            '<div id="jobsList"><p style="color:#999">Loading...</p></div>' +
            '<div id="projectPagination" style="text-align:center;margin-top:24px"></div>';

        Promise.all([
            fetchWithTimeout('/api/projects').then(function(r) { return r.json(); }),
            // Filter options come from the server: the list is paginated, so
            // there is no longer a full set of rows to derive them from.
            fetchWithTimeout('/api/projects/' + encodeURIComponent(projectId) + '/job-names').then(function(r) { return r.json(); })
        ]).then(function(results) {
            var projects = results[0].projects || [];
            var project = null;
            for (var i = 0; i < projects.length; i++) {
                if (projects[i].Id === projectId) { project = projects[i]; break; }
            }

            // Display project info
            var infoEl = document.getElementById('projectInfo');
            if (project) {
                _manualTrigger.repoUrl = project.RepoUrl;
                var httpUrl = sshToHttp(project.RepoUrl, project.WebhookType);
                var repoName = getRepoName(project.RepoUrl);
                var repoHtml = httpUrl
                    ? '<a target="_blank" href="' + escAttr(httpUrl) + '">' + escHtml(project.RepoUrl) + '</a>'
                    : escHtml(project.RepoUrl);
                infoEl.innerHTML =
                    '<div class="card" style="margin-bottom:16px">' +
                        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">' +
                            '<span style="font-size:1.6rem;font-weight:700;color:#2d3748">' + escHtml(repoName) + '</span>' +
                            '<span style="font-size:1.2rem;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.5px;margin-left:8px">' + escHtml(project.WebhookType) + '</span>' +
                        '</div>' +
                        '<div>' +
                            '<span style="font-size:1.3rem;color:#606c76">' + repoHtml + '</span>' +
                        '</div>';
            }

            var namesData = results[1];
            var filterSelect = document.getElementById('jobNameFilter');
            var names = (namesData && namesData.job_names) || [];
            for (var n = 0; n < names.length; n++) {
                var opt = document.createElement('option');
                opt.value = names[n];
                opt.textContent = names[n];
                filterSelect.appendChild(opt);
            }
            filterSelect.addEventListener('change', function() {
                _projectState.jobName = this.value;
                _projectState.page = 0;
                loadProjectJobs();
            });
            // The manual trigger panel offers the same job names as the filter,
            // and stays typeable so a job that has never run (say one just added
            // to neutron.yaml) can still be triggered. This fetch may land
            // before or after the panel is expanded — fillManualTriggerJobs
            // covers both orders.
            _projectJobNames = names;
            fillManualTriggerJobs();

            loadProjectJobs();
        }).catch(function(err) {
            document.getElementById('jobsList').innerHTML = '<p style="color:#c00">Failed to load: ' + escHtml(String(err)) + '</p>';
        });
    }

    // --- Project jobs: server-side paging ---
    var PROJECT_PAGE_SIZE = 20;
    // seq guards against out-of-order replies (fast paging / filter changes):
    // only the newest request is allowed to update the list and the pager.
    var _projectState = { id: '', page: 0, jobName: '', allHistory: false, total: 0, jobs: [], seq: 0 };

    // Job keys of the current project, from /api/projects/:id/job-names. Shared
    // by the history filter dropdown and the manual trigger panel's job field.
    var _projectJobNames = [];

    function loadProjectJobs() {
        var s = _projectState;
        var seq = ++s.seq;
        var url = '/api/projects/' + encodeURIComponent(s.id) + '/jobs?page=' + (s.page + 1) +
            '&page_size=' + PROJECT_PAGE_SIZE +
            (s.allHistory ? '&all=1' : '') +
            (s.jobName ? '&job_name=' + encodeURIComponent(s.jobName) : '');
        return fetchWithTimeout(url)
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var el = document.getElementById('jobsList');
                if (!el || seq !== s.seq) return; // navigated away or superseded
                if (data.error) {
                    el.innerHTML = '<p style="color:#c00">' + escHtml(data.error) + '</p>';
                    return;
                }
                s.jobs = data.jobs || [];
                s.total = data.total || 0;
                renderProjectJobsList();
            })
            .catch(function(err) {
                if (seq !== s.seq) return;
                var el = document.getElementById('jobsList');
                if (el) el.innerHTML = '<p style="color:#c00">Failed to load: ' + escHtml(String(err)) + '</p>';
            });
    }

    function projectJobsGoToPage(delta) {
        var totalPages = Math.ceil(_projectState.total / PROJECT_PAGE_SIZE);
        var next = _projectState.page + delta;
        if (next < 0 || (totalPages > 0 && next >= totalPages)) return;
        _projectState.page = next;
        loadProjectJobs();
    }
    window.projectJobsGoToPage = projectJobsGoToPage;

    // Toggles the recency window on the project job list. The filter dropdown
    // always lists every job key the project has ever run, so without this a job
    // that has been idle for more than the default window would be selectable
    // but always render an empty list.
    function projectJobsToggleHistory() {
        var s = _projectState;
        s.allHistory = !s.allHistory;
        s.page = 0;
        var btn = document.getElementById('historyToggle');
        if (btn) btn.textContent = s.allHistory ? 'Show last 7 days' : 'Show all history';
        loadProjectJobs();
    }
    window.projectJobsToggleHistory = projectJobsToggleHistory;

    function renderProjectJobsList() {
        var s = _projectState;
        var el = document.getElementById('jobsList');
        var pagEl = document.getElementById('projectPagination');
        if (!s.jobs || s.jobs.length === 0) {
            // The hint only makes sense inside the default window: in full-history
            // mode the list is already showing everything the toggle can reach.
            el.innerHTML = s.allHistory
                ? '<p style="color:#999;font-size:1.6rem">No pipeline runs found.</p>'
                : '<p style="color:#999;font-size:1.6rem">No pipeline runs in the last 7 days.</p>' +
                  '<p style="color:#999;font-size:1.4rem;margin-top:4px">Use <b>Show all history</b> to search the full history.</p>';
            if (pagEl) pagEl.innerHTML = '';
            return;
        }

        var html = '<table><thead><tr><th>Job Name</th><th>Status</th><th>Trigger</th><th>Duration</th><th></th></tr></thead><tbody>';
        for (var i = 0; i < s.jobs.length; i++) {
            var job = s.jobs[i];
            var status = {};
            try { status = JSON.parse(job.Status || '{}'); } catch(e) {}
            var statusHtml = '';
            if (status.active > 0) {
                statusHtml = '<span style="color:#2563eb">Running</span>';
            } else if (status.failed > 0) {
                statusHtml = '<span style="color:#dc2626">Failed</span>';
            } else if (status.succeeded > 0) {
                statusHtml = '<span style="color:#16a34a">Success</span>';
            } else {
                statusHtml = '<span style="color:#999">Unknown</span>';
            }
            // Calculate duration from job name timestamp to completion time
            var durationHtml = '-';
            var startTime = parseNameTimestamp(job.Name);
            if (startTime) {
                var endTime = job.CompletedAt ? new Date(job.CompletedAt) : new Date();
                var diffSec = Math.round((endTime - startTime) / 1000);
                if (diffSec < 60) {
                    durationHtml = diffSec + 's';
                } else if (diffSec < 3600) {
                    durationHtml = Math.floor(diffSec / 60) + 'm ' + (diffSec % 60) + 's';
                } else {
                    var hours = Math.floor(diffSec / 3600);
                    var mins = Math.floor((diffSec % 3600) / 60);
                    durationHtml = hours + 'h ' + mins + 'm';
                }
                if (!job.CompletedAt) {
                    durationHtml = '<span style="color:#2563eb">' + durationHtml + '</span>';
                }
            }
            // Show the generated K8s Job name rather than the logical job key:
            // one project runs the same logical job many times, and only the
            // full name tells those runs apart. It is also what the status page
            // and `kubectl get jobs` are keyed by. The logical key from
            // neutron.yaml, when the row carries one, goes in the tooltip.
            var jobLabel = job.Name || '';
            var jobTitle = job.JobName ? job.JobName + ' \u00b7 ' + job.Name : job.Name;
            html += '<tr><td><a href="#/status/' + escAttr(job.Name) + '" title="' + escAttr(jobTitle) + '">' + escHtml(jobLabel) + '</a></td><td>' + statusHtml + '</td><td>' + escHtml(status.trigger_type || '-') + '</td><td style="font-size:1.3rem;color:#606c76">' + durationHtml + '</td><td><a href="#/status/' + escAttr(job.Name) + '" class="btn btn-outline" style="padding:4px 12px;font-size:1.2rem">Detail</a></td></tr>';
        }
        html += '</tbody></table>';
        el.innerHTML = html;

        var totalPages = Math.ceil(s.total / PROJECT_PAGE_SIZE);
        var start = s.page * PROJECT_PAGE_SIZE;
        var end = start + s.jobs.length;
        var pagHtml = '<div style="font-size:1.3rem;color:#999;margin-bottom:8px">Showing ' +
            (start + 1) + '-' + end + ' of ' + s.total + ' runs</div>';
        if (totalPages > 1) {
            pagHtml += '<div style="display:flex;justify-content:center;align-items:center;gap:12px">' +
                '<button class="btn btn-outline" style="padding:6px 16px;font-size:1.3rem"' +
                    (s.page === 0 ? ' disabled' : '') +
                    ' onclick="projectJobsGoToPage(-1)">← Prev</button>' +
                '<span style="font-size:1.3rem;color:#606c76">Page ' + (s.page + 1) + ' of ' + totalPages + '</span>' +
                '<button class="btn btn-outline" style="padding:6px 16px;font-size:1.3rem"' +
                    (s.page >= totalPages - 1 ? ' disabled' : '') +
                    ' onclick="projectJobsGoToPage(1)">Next →</button>' +
                '</div>';
        }
        if (pagEl) pagEl.innerHTML = pagHtml;
    }

    // --- Manual trigger (project detail page) ---
    // Lets a run be started from the browser, which previously required a
    // webhook or a call to the trigger API. The repo URL comes from the
    // registered project, so the user only picks a ref, a job name and a
    // dependency branch. The ref lists come from the codebase gateway and the
    // dependency branch from the dependency service, both proxied by the API
    // server (the browser cannot reach them directly).
    var _manualTrigger = { projectId: '', repoUrl: '', refMode: 'branches', expanded: false, open: '', active: -1 };

    // Options per dropdown, as [{name, meta}]; `meta` is optional trailing text
    // such as the "(default)" marker on a repository's default branch.
    var _ttOptions = { ttRef: [], ttJob: [], ttDepBranch: [] };

    // One dropdown markup shared by all three fields. An editable field takes
    // free text (the job name may not be in the history yet); the others are
    // read-only, so they behave like the selects they replace.
    function ttDropdownHtml(id, editable, placeholder) {
        return '<div class="tt-dropdown">' +
            '<input type="text" id="' + id + '" class="tt-control" autocomplete="off"' +
                (editable ? '' : ' readonly') +
                ' placeholder="' + escAttr(placeholder) + '">' +
            '<span class="tt-caret"></span>' +
            // Only a field the user can type into needs clearing; the read-only
            // ones are emptied by picking another option from the list.
            (editable ? '<button type="button" class="tt-clear" id="' + id + 'Clear" title="Clear" aria-label="Clear">&times;</button>' : '') +
            '<div class="tt-options" id="' + id + 'Options"></div>' +
        '</div>';
    }

    function ttBindAll() {
        ttBind('ttRef', false);
        ttBind('ttJob', true);
        ttBind('ttDepBranch', false);
    }

    function ttBind(id, editable) {
        var input = document.getElementById(id);
        var list = document.getElementById(id + 'Options');
        if (!input || !list) return;
        var clearBtn = document.getElementById(id + 'Clear');

        input.addEventListener('focus', function() { ttOpen(id, editable ? input.value : ''); });
        input.addEventListener('click', function() { ttOpen(id, editable ? input.value : ''); });
        if (editable) {
            input.addEventListener('input', function() { ttSyncClear(id); ttOpen(id, input.value); });
            // Clearing keeps the list open on the full set: with nothing typed
            // there is nothing left to filter by. stopPropagation keeps the
            // document handler below from closing it again on this same click.
            if (clearBtn) {
                clearBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    input.value = '';
                    input.focus();
                    ttSyncClear(id);
                    ttOpen(id, '');
                });
            }
        }
        ttSyncClear(id);
        input.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                e.preventDefault();
                if (_manualTrigger.open !== id) { ttOpen(id, editable ? input.value : ''); return; }
                ttMove(id, e.key === 'ArrowDown' ? 1 : -1);
            } else if (e.key === 'Enter') {
                if (_manualTrigger.open === id) { e.preventDefault(); ttCommit(id); }
            } else if (e.key === 'Escape') {
                ttClose();
            }
        });
        list.addEventListener('click', function(e) {
            var option = ttFindOption(e.target, list);
            if (option) ttPick(id, option.getAttribute('data-value'));
        });
    }

    // Registered once rather than per list: the list is rebuilt on every render,
    // so a per-list listener would have to be re-attached each time.
    document.addEventListener('click', function(e) {
        var id = _manualTrigger.open;
        if (!id) return;
        var input = document.getElementById(id);
        var box = input ? input.parentNode : null;
        if (box && box.contains(e.target)) return;
        ttClose();
    });

    function ttOpen(id, filter) {
        var list = document.getElementById(id + 'Options');
        if (!list) return;
        if (_manualTrigger.open && _manualTrigger.open !== id) ttClose();
        ttRenderOptions(id, filter);
        list.classList.add('open');
        _manualTrigger.open = id;
        _manualTrigger.active = -1;
    }

    function ttClose() {
        var id = _manualTrigger.open;
        if (!id) return;
        var list = document.getElementById(id + 'Options');
        if (list) list.classList.remove('open');
        _manualTrigger.open = '';
        _manualTrigger.active = -1;
    }

    function ttRenderOptions(id, filter) {
        var list = document.getElementById(id + 'Options');
        if (!list) return;
        var all = _ttOptions[id] || [];
        var needle = String(filter == null ? '' : filter).toLowerCase();
        var shown = [];
        for (var i = 0; i < all.length; i++) {
            if (!needle || all[i].name.toLowerCase().indexOf(needle) >= 0) shown.push(all[i]);
        }
        // The typed text matches nothing — a typo, or a job that has never run
        // and so is not in the history yet. Fall back to every option instead
        // of stranding the user on "No match": switching to a different job
        // should not require clearing the field first.
        if (needle && shown.length === 0) shown = all;

        var html = '';
        for (var j = 0; j < shown.length; j++) {
            html += '<div class="tt-option" data-value="' + escAttr(shown[j].name) + '">' +
                escHtml(shown[j].name) +
                (shown[j].meta ? '<span class="tt-option-meta">' + escHtml(shown[j].meta) + '</span>' : '') +
                '</div>';
        }
        if (!html) {
            html = '<div class="tt-option is-empty">' + (needle ? 'No match' : 'No options') + '</div>';
        }
        list.innerHTML = html;
    }

    // Walks up from the click target to the option element, so the meta span and
    // any other child of an option still select it.
    function ttFindOption(node, list) {
        while (node && node !== list) {
            if (node.getAttribute && node.getAttribute('data-value') !== null) return node;
            node = node.parentNode;
        }
        return null;
    }

    function ttMove(id, delta) {
        var list = document.getElementById(id + 'Options');
        if (!list) return;
        var opts = list.querySelectorAll('.tt-option[data-value]');
        if (!opts.length) return;
        var idx = _manualTrigger.active + delta;
        if (idx < 0) idx = opts.length - 1;
        if (idx >= opts.length) idx = 0;
        for (var i = 0; i < opts.length; i++) {
            if (i === idx) opts[i].classList.add('active'); else opts[i].classList.remove('active');
        }
        _manualTrigger.active = idx;
    }

    function ttCommit(id) {
        var list = document.getElementById(id + 'Options');
        if (!list) return;
        var opts = list.querySelectorAll('.tt-option[data-value]');
        if (_manualTrigger.active < 0 || _manualTrigger.active >= opts.length) { ttClose(); return; }
        ttPick(id, opts[_manualTrigger.active].getAttribute('data-value'));
    }

    // Shows the clear button only while the field holds a value. Called from
    // everywhere that value can change — typing, picking, clearing, and a
    // refreshed option set — so the button cannot drift out of sync with it.
    function ttSyncClear(id) {
        var input = document.getElementById(id);
        if (!input || !input.parentNode) return;
        input.parentNode.classList.toggle('has-value', !!input.value);
    }

    function ttPick(id, value) {
        var input = document.getElementById(id);
        if (input) input.value = value;
        ttSyncClear(id);
        ttClose();
    }

    // Replaces one dropdown's options. clearIfMissing drops a current selection
    // that the new set no longer offers — e.g. a branch name after the ref list
    // was switched to tags. It is off for the job field, where a typed name that
    // is not in the history is legitimate and must survive a refresh.
    function ttSetOptions(id, items, clearIfMissing) {
        _ttOptions[id] = items || [];
        var input = document.getElementById(id);
        if (input && clearIfMissing && input.value) {
            var keep = false;
            for (var i = 0; i < _ttOptions[id].length; i++) {
                if (_ttOptions[id][i].name === input.value) { keep = true; break; }
            }
            if (!keep) { input.value = ''; ttSyncClear(id); }
        }
        if (_manualTrigger.open === id) ttRenderOptions(id, '');
    }

    function renderManualTriggerToolbar() {
        // Grid order: Ref | Job | DEP_BRANCH | Trigger on one row, with the
        // result spanning the panel underneath once there is one.
        return '<div class="trigger-toolbar" id="manualTriggerToolbar">' +
            '<div class="tt-field">' +
                '<label class="tt-label tt-clickable" onclick="manualTriggerToggleRef()" title="Click to switch between the branch list and the tag list">Ref · <span id="ttRefMode">Branches</span> ⇄</label>' +
                ttDropdownHtml('ttRef', false, 'Select branch / tag') +
            '</div>' +
            '<div class="tt-field">' +
                '<label class="tt-label" for="ttJob">Job</label>' +
                ttDropdownHtml('ttJob', true, 'job name') +
            '</div>' +
            '<div class="tt-field">' +
                '<label class="tt-label" for="ttDepBranch">DEP_BRANCH</label>' +
                ttDropdownHtml('ttDepBranch', false, 'Select branch') +
            '</div>' +
            '<div class="tt-actions">' +
                '<button class="btn btn-outline tt-submit" id="ttSubmit" onclick="manualTriggerSubmit()">Trigger</button>' +
                '<button class="tt-collapse" type="button" title="Hide the manual trigger panel" onclick="manualTriggerToggle()">&times;</button>' +
            '</div>' +
            '<span id="manualTriggerResult" class="tt-result" style="display:none"></span>' +
        '</div>';
    }

    // The panel is collapsed by default, so the project page opens on a single
    // button rather than a form nobody asked for. Which of the two is rendered
    // is the only difference between the two states.
    function renderManualTriggerPanel() {
        if (_manualTrigger.expanded) return renderManualTriggerToolbar();
        return '<button class="btn btn-outline" id="ttExpand" type="button"' +
            ' style="padding:8px 18px;font-size:1.3rem;margin-top:0"' +
            ' onclick="manualTriggerToggle()">Manual Trigger</button>';
    }

    function manualTriggerToggle() {
        _manualTrigger.expanded = !_manualTrigger.expanded;
        ttClose();
        var panel = document.getElementById('manualTriggerPanel');
        if (!panel) return;
        panel.innerHTML = renderManualTriggerPanel();
        if (!_manualTrigger.expanded) return;
        // The dropdowns are recreated with the panel, so their listeners have to
        // be attached again. Everything they show is then fetched — the page
        // never asks the gateway or the dependency service for anything unless
        // this panel is opened.
        ttBindAll();
        fillManualTriggerJobs();
        loadManualTriggerRefs();
        loadManualTriggerDependency();
    }
    window.manualTriggerToggle = manualTriggerToggle;

    // The job field's candidates come from the project's job history, which the
    // page fetches independently of the panel (and possibly before it is
    // opened), so they are held here and applied whenever the panel renders.
    function fillManualTriggerJobs() {
        if (!document.getElementById('ttJob')) return; // panel still collapsed
        var items = [];
        for (var i = 0; i < _projectJobNames.length; i++) {
            items.push({ name: _projectJobNames[i] });
        }
        ttSetOptions('ttJob', items);
    }

    function loadManualTriggerRefs() {
        var input = document.getElementById('ttRef');
        if (!input) return; // panel still collapsed, or navigated away
        var mode = _manualTrigger.refMode;
        fetchWithTimeout('/api/projects/' + encodeURIComponent(_manualTrigger.projectId) + '/' + mode)
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (!document.body.contains(input)) return; // navigated away
                if (data.error) throw new Error(data.error);
                var items = data[mode] || [];
                // Branches list the repository default first: it is what most
                // manual runs want, and a plain alphabetical list buries it.
                if (mode === 'branches') {
                    items = items.slice().sort(function(a, b) {
                        return (b.default ? 1 : 0) - (a.default ? 1 : 0);
                    });
                }
                var options = [];
                for (var i = 0; i < items.length; i++) {
                    options.push({ name: items[i].name, meta: items[i].default ? '(default)' : '' });
                }
                input.title = '';
                ttSetOptions('ttRef', options, true);
            })
            .catch(function(err) {
                if (!document.body.contains(input)) return;
                ttSetOptions('ttRef', [], true);
                // The field is far too narrow for the reason (usually an
                // unconfigured gateway), so keep it in the tooltip.
                input.title = (err && err.message) ? err.message : String(err);
                console.warn('manual trigger: ' + mode + ' list failed: ' + err);
            });
    }

    function loadManualTriggerDependency() {
        var input = document.getElementById('ttDepBranch');
        if (!input) return; // panel still collapsed, or navigated away
        fetchWithTimeout('/api/dependency/branches')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (!document.body.contains(input)) return;
                if (data.error) throw new Error(data.error);
                var branches = data.branches || [];
                var options = [];
                for (var i = 0; i < branches.length; i++) {
                    options.push({ name: branches[i] });
                }
                input.title = '';
                ttSetOptions('ttDepBranch', options, true);
                // Preselect the service's current default, if it names one of
                // the branches just listed. Matching explicitly keeps an absent
                // value from blanking the field.
                fetchWithTimeout('/api/dependency/default')
                    .then(function(r) { return r.json(); })
                    .then(function(def) {
                        if (!document.body.contains(input)) return;
                        var want = (def && def.branch) || '';
                        for (var k = 0; k < options.length; k++) {
                            if (options[k].name === want) { input.value = want; break; }
                        }
                    })
                    .catch(function() { /* leave the field empty */ });
            })
            .catch(function(err) {
                if (!document.body.contains(input)) return;
                ttSetOptions('ttDepBranch', [], true);
                input.title = (err && err.message) ? err.message : String(err);
                console.warn('manual trigger: dependency branches failed: ' + err);
            });
    }

    function manualTriggerToggleRef() {
        _manualTrigger.refMode = _manualTrigger.refMode === 'branches' ? 'tags' : 'branches';
        var modeEl = document.getElementById('ttRefMode');
        if (modeEl) modeEl.textContent = _manualTrigger.refMode === 'branches' ? 'Branches' : 'Tags';
        ttClose();

    // Renders the toolbar's inline feedback, right after the trigger button.
    // A successful trigger links straight to the new run's status page. An empty
    // message collapses the element, so idle it takes no room in the toolbar.
    function manualTriggerResult(message, isError, jobName) {
        var el = document.getElementById('manualTriggerResult');
        if (!el) return;
        if (!message) {
            el.innerHTML = '';
            el.style.display = 'none';
            return;
        }
        var html = '<span style="color:' + (isError ? '#c00' : '#16a34a') + '">' + escHtml(message) + '</span>';
        if (jobName) {
            html += ' <a href="#/status/' + escAttr(jobName) + '">View run &rarr;</a>';
        }
        el.innerHTML = html;
        // Toggled explicitly rather than cleared: while hidden the element is
        // not a grid item at all, so it contributes no empty row to the panel.
        el.style.display = 'block';
    }

    function manualTriggerSubmit() {
        var refEl = document.getElementById('ttRef');
        var jobEl = document.getElementById('ttJob');
        var depEl = document.getElementById('ttDepBranch');

        var ref = refEl ? refEl.value : '';
        var jobName = jobEl ? jobEl.value.trim() : '';
        var depBranch = depEl ? depEl.value : '';

        if (!_manualTrigger.repoUrl) { manualTriggerResult('Project not found.', true); return; }
        if (!ref) { manualTriggerResult('Select a branch or tag first.', true); return; }
        if (!jobName) { manualTriggerResult('Select or type a job name first.', true); return; }

        // A release job run off a branch ships that branch name as the version,
        // which is almost never what was meant. Not blocked outright — one
        // confirmation, then it fires. Skipped once the ref is a tag, since a
        // tag is exactly what these jobs are supposed to run from.
        if (isPublishJobName(jobName) && _manualTrigger.refMode === 'branches') {
            confirmPublishOnBranch(jobName, ref, function() { triggerManual(ref, jobName, depBranch); });
            return;
        }
        triggerManual(ref, jobName, depBranch);
    }

    // Fires the request. Split out of the submit handler so the confirmation
    // above can decide whether it runs at all.
    function triggerManual(ref, jobName, depBranch) {
        var btn = document.getElementById('ttSubmit');

        var payload = { repo_url: _manualTrigger.repoUrl, job_name: jobName, ref: ref, env: {} };
        if (depBranch) payload.env.DEP_BRANCH = depBranch;

        if (btn) { btn.disabled = true; btn.textContent = 'Triggering...'; }
        manualTriggerResult('', false);
        fetch('/api/trigger', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
            .then(function(r) {
                return r.text().then(function(text) { return { ok: r.ok, status: r.status, text: text }; });
            })
            .then(function(res) {
                var data = null;
                try { data = JSON.parse(res.text); } catch (e) {}
                if (!res.ok) {
                    manualTriggerResult((data && data.error) || res.text || ('HTTP ' + res.status), true);
                    return;
                }
                manualTriggerResult('Pipeline triggered.', false, (data && data.job_name) || '');
                loadProjectJobs();
            })
            .catch(function(err) {
                manualTriggerResult('Trigger failed: ' + err, true);
            })
            .then(function() {
                if (btn) { btn.disabled = false; btn.textContent = 'Trigger'; }
            });
    }
    window.manualTriggerSubmit = manualTriggerSubmit;

    // Release jobs are named after what they publish, so anything containing
    // "publish" is treated as one. Case-insensitive: the name comes from
    // neutron.yaml, where it may be spelled either way.
    function isPublishJobName(jobName) {
        return jobName.toLowerCase().indexOf('publish') >= 0;
    }

    // Holds up a release job that is about to run off a branch. Tags are what
    // these are meant to be triggered from; a branch is allowed, just rarely
    // what the user actually wanted.
    function confirmPublishOnBranch(jobName, ref, onConfirm) {
        confirmDialog(
            'Trigger a release job from a branch?',
            'Release jobs should be triggered from a tag. Running "' + jobName + '" from the branch "' + ref + '" sends the branch name as the version.',
            'Continue Anyway',
            onConfirm
        );
    }

    // A stand-in for window.confirm, which offers neither the wording nor the
    // styling this one needs: the native dialog has no way to mark the proceed
    // button red. Escape and a backdrop click both dismiss it, so every way out
    // except the labelled button takes the safe branch.
    function confirmDialog(title, body, confirmLabel, onConfirm) {
        var previous = document.getElementById('ttConfirmModal');
        if (previous) previous.remove();

        var overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.id = 'ttConfirmModal';

        function dismiss() {
            document.removeEventListener('keydown', onKey);
            overlay.remove();
        }
        function onKey(e) {
            if (e.key === 'Escape') { e.preventDefault(); dismiss(); }
        }

        overlay.onclick = function(e) { if (e.target === overlay) dismiss(); };
        document.addEventListener('keydown', onKey);

        var modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML =
            '<h4>' + escHtml(title) + '</h4>' +
            '<p class="modal-body">' + escHtml(body) + '</p>' +
            '<div class="modal-actions">' +
                '<button type="button" class="btn btn-danger" id="ttConfirmProceed">' + escHtml(confirmLabel) + '</button>' +
                '<button type="button" class="btn btn-outline" id="ttConfirmCancel">Cancel</button>' +
            '</div>';
        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        document.getElementById('ttConfirmCancel').onclick = dismiss;
        document.getElementById('ttConfirmProceed').onclick = function() {
            dismiss();
            onConfirm();
        };
    }

        app.innerHTML =

    function parseParamList(paramsStr) {
        if (!paramsStr) return [];
        return paramsStr.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s !== ''; });
    }

    function buildUsageUrl(name, params) {
        var base = location.protocol + '//' + location.host + '/s/' + encodeURIComponent(name);
        if (params.length === 0) return { url: base, cmd: 'curl -s "' + base + '" | bash' };
        var qs = params.map(function(p) { return p + '=<VALUE>'; }).join('&');
        var url = base + '?' + qs;
        return { url: url, cmd: 'curl -s "' + url + '" | bash' };
    }

    function renderSnippetsList(snippets) {
        var el = document.getElementById('snippetsList');
        if (!snippets || snippets.length === 0) {
            el.innerHTML = '<p style="color:#999">No snippets yet. Use the Refresh button to sync from GitLab.</p>';
            return;
        }

        var html = '<table><thead><tr><th>Name</th><th>Title</th><th>Description</th><th></th></tr></thead><tbody>';
        for (var i = 0; i < snippets.length; i++) {
            var s = snippets[i];
            html += '<tr>' +
                '<td><b>' + escHtml(s.name) + '</b></td>' +
                '<td>' + escHtml(s.title) + '</td>' +
                '<td style="font-size:1.3rem;color:#999">' + escHtml(s.description || '-') + '</td>' +
                '<td><a href="javascript:void(0)" class="btn btn-outline" style="padding:4px 12px;font-size:1.2rem" onclick="viewSnippet(\'' + escAttr(s.name) + '\')">View</a></td>' +
                '</tr>';
        }
        html += '</tbody></table>';
        el.innerHTML = html;
    }

    function viewSnippet(name) {
        var s = null;
        for (var i = 0; i < _snippets.length; i++) {
            if (_snippets[i].name === name) { s = _snippets[i]; break; }
        }
        if (!s) return;

        var params = parseParamList(s.params);
        var usage = buildUsageUrl(name, params);

        var overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.id = 'snippetViewModal';
        overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };

        var paramsHtml = '';
        if (params.length > 0) {
            paramsHtml = '<div style="margin-top:16px"><span style="font-size:1.2rem;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.5px">Parameters</span>' +
                '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">';
            for (var i = 0; i < params.length; i++) {
                paramsHtml += '<code style="background:#f5f3ff;color:#6d28d9;padding:2px 8px;border-radius:4px;font-size:1.2rem">' + escHtml(params[i]) + '</code>';
            }
            paramsHtml += '</div></div>';
        }

        var modal = document.createElement('div');
        modal.className = 'modal';
        modal.style.maxWidth = '640px';
        modal.innerHTML =
            '<h4>' + escHtml(s.title) + '</h4>' +
            '<div style="font-size:1.3rem;color:#606c76;margin-bottom:16px">' +
                '<span style="font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.5px;font-size:1.2rem">name</span> ' +
                '<code style="font-size:1.4rem">' + escHtml(s.name) + '</code>' +

            (s.description ? '<p style="font-size:1.4rem;color:#606c76;margin-bottom:16px">' + escHtml(s.description) + '</p>' : '') +
            '<label style="margin-top:0">Script</label>' +

            paramsHtml +
            '<div style="margin-top:16px"><span style="font-size:1.2rem;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.5px">Usage</span>' +
                '<div style="display:flex;align-items:center;gap:8px;margin-top:8px">' +

                '</div>' +

            '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">' +
                '<button class="btn btn-outline" style="margin-top:0" onclick="document.getElementById(\'snippetViewModal\').remove()">Close</button>' +
            '</div>';
        overlay.appendChild(modal);
        document.body.appendChild(overlay);
    }
