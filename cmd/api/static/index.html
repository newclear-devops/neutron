        var msgEl = document.getElementById('defaultPipelineMsg');

        fetch('/api/default-pipeline')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.error) { showDefaultPipelineMsg(data.error, true); return; }
                textarea.value = data.content || '';
            })
            .catch(function(err) { showDefaultPipelineMsg('Failed to load: ' + err, true); });

        function showDefaultPipelineMsg(text, isError) {
            msgEl.textContent = text;
            msgEl.style.color = isError ? '#dc2626' : '#16a34a';
            msgEl.style.display = 'block';
        }
    }
    window.renderDefaultPipeline = renderDefaultPipeline;

    // --- Status ---
    function renderStatus(jobName) {
        app.innerHTML =
            '<p class="page-title">Loading status for <b>' + escHtml(jobName) + '</b>...</p>';

        fetch('/api/status/' + encodeURIComponent(jobName))
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.error) {
                    app.innerHTML = '<p class="page-title">Error</p><p>' + escHtml(data.error) + '</p>';
                    return;
                }
                // Always use renderStatusLive since we now always have job and pods
                renderStatusLive(data.job, data.pods, data.status, data.reportUrl, data.rerunnable,
                    data.projectId, data.stuck, data.jobKey, data.params);
            })
            .catch(function(err) {
                app.innerHTML = '<p class="page-title">Error</p><p>' + escHtml(String(err)) + '</p>';
            });
    }

    // Trigger context of a run: which ref it was triggered against and which env
    // vars were injected into the pod (webhook query params, or the "env" of
    // /api/trigger). Values are shown verbatim — this page has no access control,
    // so anything passed through env is visible to everyone who can open it.
    function renderTriggerDetails(jobKey, params) {
        var rows = '';
        function row(label, value) {
            rows += '<tr><td style="padding:3px 16px 3px 0;color:#606c76;white-space:nowrap">' + escHtml(label) +
                '</td><td style="padding:3px 0">' + escHtml(value) + '</td></tr>';
        }
        if (jobKey) row('Job', jobKey);
        if (params) {
            if (params.ref) row('Ref', params.ref);
            if (params.commit_sha) row('Commit', params.commit_sha);
            if (params.trigger) row('Trigger', params.trigger);
        }
        if (!rows) return '';

        var env = (params && params.env) || {};
        var envKeys = Object.keys(env).sort();
        var envHtml = '';
        if (envKeys.length) {
            for (var i = 0; i < envKeys.length; i++) {
                envHtml += '<tr><td style="padding:3px 16px 3px 0;color:#606c76;font-family:monospace">' +
                    escHtml(envKeys[i]) +
                    '</td><td style="padding:3px 0;font-family:monospace;word-break:break-all">' +
                    escHtml(env[envKeys[i]]) + '</td></tr>';
            }
        } else if (params) {
            envHtml = '<tr><td colspan="2" style="padding:3px 0;color:#999">No environment variables injected.</td></tr>';
        }

        return '<div class="card" style="margin-top:16px">' +
            '<p style="font-size:1.4rem;font-weight:600;color:#2d3748;margin-bottom:8px">Trigger details</p>' +
            '<table style="font-size:1.3rem"><tbody>' + rows + '</tbody></table>' +
            (envHtml ?
                '<p style="font-size:1.3rem;font-weight:600;color:#606c76;margin:14px 0 4px">Environment</p>' +
                '<table style="font-size:1.3rem"><tbody>' + envHtml + '</tbody></table>'
                : '') +
            // Sits beside the run's own DEP_BRANCH so the two can be compared:
            // this is the dependency service's current default — what a new run
            // would pick up — and an env var of the same name wins over it.
            // Filled in by loadDefaultDependency() after the card is in the DOM.
            '<p style="font-size:1.3rem;font-weight:600;color:#606c76;margin:14px 0 4px">Default Dependency ' +
                '<span style="font-weight:400;color:#999">(will override by Environment)</span></p>' +
            '<p style="font-size:1.3rem;font-family:monospace;color:#999" id="defaultDependency">&hellip;</p>' +
            '</div>';
    }

    // Fills the "Default Dependency" value from the dependency service. It
    // cannot be rendered inline with the rest of the card because it is the only
    // value there that has to be fetched rather than read off the run's params.
    function loadDefaultDependency() {
        var cell = document.getElementById('defaultDependency');
        if (!cell) return;
        fetchWithTimeout('/api/dependency/default')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (!document.body.contains(cell)) return; // navigated away
                if (data && data.error) throw new Error(data.error);
                var branch = (data && data.branch) || '';
                cell.innerHTML = branch ? escHtml(branch) : '-';
                cell.style.color = branch ? '#606c76' : '#999';
            })
            .catch(function(err) {
                if (!document.body.contains(cell)) return;
                cell.innerHTML = '-';
                cell.title = (err && err.message) ? err.message : String(err);
            });
    }

    function renderStatusLive(job, podsData, dbStatus, reportUrl, rerunnable, projectId, stuck, jobKey, params) {
        var ann = job && job.metadata && job.metadata.annotations ? job.metadata.annotations : {};
        var st = job ? (job.status || {}) : {};
        var items = podsData && podsData.items ? podsData.items : [];
        var jobName = job && job.metadata ? job.metadata.name : '';

        // Use database status if available, otherwise derive from K8s
        // Note: dbStatus uses lowercase keys (from JSON), K8s uses PascalCase
        var status = dbStatus || {};
        var active = status.active || st.Active || 0;
        var succeeded = status.succeeded || st.Succeeded || 0;
        var failed = status.failed || st.Failed || 0;
        var webhookType = status.webhook_type || ann.sourceType || '';
        var triggerType = status.trigger_type || ann.triggerType || '';
        var sourceUrl = status.source_url || ann.sourceUrl || '';

        // A run can be force-killed only while Kubernetes still has it active.
        // A "stuck" run (its Job already gone) is excluded: there is nothing
        // left to delete, and recording "failed" would assert an outcome nobody
        // actually knows.
        var killable = !stuck && active > 0;

        var podsHtml = '';
        for (var i = 0; i < items.length; i++) {
            var pod = items[i];
            var name = pod.metadata ? pod.metadata.name : '';
            var uid = pod.metadata ? pod.metadata.uid : '';
            var phase = pod.status ? pod.status.phase : '';
            if (appConfig.logUrl) {
                podsHtml += '<tr><td><a href="javascript:void(0)" onclick="openPodLog(\'' + escAttr(name) + '\',\'' + escAttr(uid) + '\')">' + escHtml(name) + '</a></td><td>' + escHtml(phase) + '</td></tr>';
            } else {
                podsHtml += '<tr><td>' + escHtml(name) + '</td><td>' + escHtml(phase) + '</td></tr>';
            }
        }

        app.innerHTML =
            '<p class="page-title">Job &mdash; <b>' + escHtml(jobName) + '</b></p>' +
            '<div class="card">' +
                '<div class="meta">' +
                    '<div>A <b>' + escHtml(webhookType) + '</b> &rarr; <b>' + escHtml(triggerType) + '</b> pipeline</div>' +
                    '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
                        (sourceUrl ? '<a target="_blank" href="' + escAttr(sourceUrl) + '" style="display:inline-block;background:#1a73e8;color:#fff;padding:2px 10px;border-radius:4px;font-size:1.2rem;text-decoration:none">show pipeline code</a>' : '') +
                        (projectId ? '<a href="#/project/' + escAttr(projectId) + '" class="btn btn-outline" style="padding:2px 10px;font-size:1.2rem">back to project</a>' : '') +
                    '</div>' +
                '</div>' +
                '<div class="stat-row">' +
                    '<div class="stat">Active: <b>' + active + '</b></div>' +
                    '<div class="stat">Succeeded: <b>' + succeeded + '</b></div>' +
                    '<div class="stat">Failed: <b>' + failed + '</b></div>' +
                '</div>' +
                (items.length > 0 ?
                    '<table class="pod-table"><thead><tr><th>Pod</th><th>Status</th></tr></thead><tbody>' + podsHtml + '</tbody></table>'
                    : '<p style="color:#999;margin-top:12px">No pods found.</p>') +
                (appConfig.logUrl ? '<p class="log-hint">Click pod name to view logs on external platform</p>' : '') +
                (stuck ? '<p style="color:#b06000;margin-top:12px">The Kubernetes Job for this run has already been cleaned up, so no further status will arrive. Its outcome is unknown.</p>' : '') +
                // Laid out as two columns matching the pod table's, so Kill sits
                // under the Status column and the benign actions stay under Pod.
                // It is also the far side of the row from them, which keeps the
                // destructive button away from the ones clicked routinely.
                ((reportUrl || rerunnable || killable) ?
                    '<div class="pod-actions">' +
                        '<div class="pa-left">' +
                            (reportUrl ? '<a target="_blank" href="' + escAttr(reportUrl) + '" class="btn btn-outline" style="padding:6px 16px;font-size:1.3rem">Test Report</a>' : '') +
                            (rerunnable ? '<button class="btn btn-outline" style="padding:6px 16px;font-size:1.3rem" onclick="rerunJob(\'' + escAttr(jobName) + '\')">Rerun</button>' : '') +
                        '</div>' +
                        '<div class="pa-kill">' +
                            (killable ? '<button class="btn btn-outline" style="padding:6px 16px;font-size:1.3rem;color:#dc2626;border-color:#f0b4b4" onclick="killJob(\'' + escAttr(jobName) + '\')">Kill</button>' : '') +
                        '</div>' +
                    '</div>'
                    : '') +
            '</div>' +
            renderTriggerDetails(jobKey, params);

        // The Default Dependency row shows a live value from the dependency
        // service, so it is filled in once the card is in the DOM.
        loadDefaultDependency();
    }

    function rerunJob(jobName) {
        if (!confirm('Rerun this job with the same commit and parameters?')) return;
        fetch('/api/jobs/' + encodeURIComponent(jobName) + '/rerun', { method: 'POST' })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.error) { alert(data.error); return; }
                location.hash = '#/status/' + data.job_name;
            })
            .catch(function(err) { alert('Rerun failed: ' + err); });
    }
    window.rerunJob = rerunJob;

    // Force-terminates a run that is stuck: the server deletes the Kubernetes
    // Job (cascading to its Pods) and records the run as failed, so it stops
    // holding cluster resources and stops counting as a running sibling.
    function killJob(jobName) {
        if (!confirm('Force-kill this run?\n\nIts steps are stopped immediately and the Kubernetes Job and its Pods are deleted. A deploy or any other side-effecting step may be left half-done.')) return;
        fetch('/api/jobs/' + encodeURIComponent(jobName) + '/kill', { method: 'POST' })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.error) { alert(data.error); return; }
                // Re-render so the recorded outcome replaces the running state.
                renderStatus(jobName);
            })
            .catch(function(err) { alert('Kill failed: ' + err); });
    }
    window.killJob = killJob;

    // --- Utils ---
    // Copy text to clipboard. navigator.clipboard is only available in secure
    // contexts (HTTPS / localhost); over plain HTTP it is undefined, so fall
    // back to a temporary textarea + execCommand('copy'). Returns a Promise.
    function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
            return navigator.clipboard.writeText(text);
        }
        return new Promise(function(resolve, reject) {
            try {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.top = '-9999px';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                var ok = document.execCommand('copy');
                document.body.removeChild(ta);
                ok ? resolve() : reject(new Error('execCommand copy failed'));
            } catch (e) {
                reject(e);
            }
        });
    }

    function escHtml(s) {
        if (!s) return '';
        var d = document.createElement('div');
        d.appendChild(document.createTextNode(String(s)));
        return d.innerHTML;
    }

    function escAttr(s) {
        return String(s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
})();
</script>
</body>
</html>
